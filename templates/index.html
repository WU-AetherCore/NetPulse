<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse - 网络设备管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .header {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .logo-text h1 { font-size: 18px; font-weight: 600; }
        .logo-text p { font-size: 12px; color: #888; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); }
        .btn-primary:hover { opacity: 0.9; }
        .btn-sm { padding: 4px 8px; font-size: 11px; }
        .btn-danger { background: rgba(244, 67, 54, 0.2); color: #f44336; border: 1px solid rgba(244, 67, 54, 0.3); }
        .btn-danger:hover { background: rgba(244, 67, 54, 0.3); }
        .btn-success { background: rgba(76, 175, 80, 0.2); color: #4caf50; border: 1px solid rgba(76, 175, 80, 0.3); }
        .btn-success:hover { background: rgba(76, 175, 80, 0.3); }
        .btn-warning { background: rgba(255, 152, 0, 0.2); color: #ff9800; border: 1px solid rgba(255, 152, 0, 0.3); }
        .btn-warning:hover { background: rgba(255, 152, 0, 0.3); }
        .btn-info { background: rgba(33, 150, 243, 0.2); color: #2196f3; border: 1px solid rgba(33, 150, 243, 0.3); }
        .btn-info:hover { background: rgba(33, 150, 243, 0.3); }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }
        .badge-danger { background: rgba(244, 67, 54, 0.2); color: #f44336; border: 1px solid rgba(244, 67, 54, 0.3); }
        .badge-warning { background: rgba(255, 152, 0, 0.2); color: #ff9800; border: 1px solid rgba(255, 152, 0, 0.3); }
        .container { padding: 25px 30px; max-width: 1600px; margin: 0 auto; }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 12px;
            overflow-x: auto;
        }
        .nav-tab {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.3s;
            border: none;
            background: transparent;
            color: #aaa;
        }
        .nav-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .nav-tab:hover:not(.active) { background: rgba(255,255,255,0.1); color: #fff; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .stat-sub { font-size: 12px; color: #666; margin-top: 5px; }
        .stat-icon { float: right; font-size: 30px; opacity: 0.5; }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .device-table { width: 100%; border-collapse: collapse; }
        .device-table th {
            text-align: left;
            padding: 12px;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .device-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .device-table tr { transition: background 0.2s ease; }
        .device-table tr:hover { background: rgba(102,126,234,0.08); }
        .device-table tr:hover td { border-bottom-color: rgba(102,126,234,0.2); }
        .device-name { font-weight: 600; cursor: pointer; transition: color 0.2s; }
        .device-name:hover { color: #667eea; }
        .device-mac { font-size: 11px; color: #666; font-family: monospace; }
        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .online { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .offline { background: #666; }
        .rate-up { color: #ff9800; }
        .rate-down { color: #2196f3; }
        .chart-container { position: relative; height: 300px; margin: 15px 0; }
        .event-list { max-height: 500px; overflow-y: auto; }
        .event-item {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-type {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
        }
        .event-first_seen { background: rgba(103, 126, 234, 0.2); color: #667eea; }
        .event-disconnect { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .event-connect { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 25px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        .modal-close:hover { color: #fff; }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .info-item {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 8px;
            min-width: 0;
            overflow: hidden;
        }
        .info-item-wide {
            grid-column: span 2;
        }
        .info-label { font-size: 11px; color: #888; margin-bottom: 4px; }
        .info-value {
            font-size: 14px;
            font-weight: 600;
            margin-top: 2px;
            word-break: break-all;
            overflow-wrap: anywhere;
            line-height: 1.4;
            white-space: normal;
        }
        .tab-sub {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-sub-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
        }
        .tab-sub-btn.active { background: rgba(102, 126, 234, 0.3); color: #fff; border-color: #667eea; }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .empty-state-icon { font-size: 48px; margin-bottom: 15px; }
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .header { padding: 12px 15px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-value { font-size: 22px; }
            .device-table { font-size: 12px; }
            .device-table th, .device-table td { padding: 8px 6px; }
        }
    </style>
</head>
